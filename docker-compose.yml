services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aibde-postgres
    environment:
      POSTGRES_USER: aibde
      POSTGRES_PASSWORD: aibde
      POSTGRES_DB: aibde
    ports:
      - "5432:5432"
    volumes:
      - aibde_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibde -d aibde"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aibde-redis
    ports:
      - "6379:6379"
    volumes:
      - aibde_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aibde_pg:
  aibde_redis:
